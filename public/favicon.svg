<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#111827"/>

  <!-- Outer spool rim -->
  <circle cx="16" cy="16" r="14" fill="#1a2744" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Wound filament body -->
  <circle cx="16" cy="16" r="11" fill="url(#body)"/>

  <!-- Winding rings -->
  <circle cx="16" cy="16" r="9"  fill="none" stroke="rgba(0,240,255,0.35)" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="7"  fill="none" stroke="rgba(0,240,255,0.28)" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="5"  fill="none" stroke="rgba(0,240,255,0.22)" stroke-width="1.5"/>

  <!-- Hub -->
  <circle cx="16" cy="16" r="3.5" fill="#111827"/>
  <circle cx="16" cy="16" r="1.8" fill="#00F0FF" fill-opacity="0.55"/>

  <!-- Highlight -->
  <ellipse cx="11" cy="11" rx="3.5" ry="2" fill="white" fill-opacity="0.07" transform="rotate(-30 11 11)"/>

  <defs>
    <radialGradient id="body" cx="38%" cy="32%" r="72%">
      <stop offset="0%"   stop-color="#4ff0ff" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#0099cc" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#003d66" stop-opacity="0.9"/>
    </radialGradient>
  </defs>
</svg>
